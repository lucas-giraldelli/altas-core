# Site estático (nginx, serve ./build) + PocketBase (SQLite em ./pb_data).
# Local: http://localhost:4173 · API: http://localhost:8090
# Para expor na internet, coloque um proxy com TLS na frente (Cloudflare Tunnel, Caddy, Traefik…)
# apontando o site para atlas:80 e a API para atlas-db:8090, e ajuste PUBLIC_PB_URL no .env.
services:
  atlas:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      # monta o projeto inteiro (ro) e o nginx serve só ./build: o bind mount sobrevive ao `pnpm build`, que recria build/
      - .:/srv/atlas:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4173:80"
  atlas-db:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks:ro
    env_file:
      - secrets.env   # LLM_KEY, LLM_MODEL, LLM_PROVIDER (fora do git)
    ports:
      - "127.0.0.1:8090:8090"

# Tudo exige um token válido do PocketBase (cookie atlas_token), verificado a cada requisição
# via auth_request. Sem token: 401 → redireciona para /gate/. Só /gate/ e os assets são livres.
server {
    listen 80;
    server_name _;
    root /srv/atlas/build;
    index index.html;
    charset utf-8;
    types { text/html ahtml; application/manifest+json webmanifest; }  # .ahtml = HTML de exemplo/anexo, servido como página mas fora do índice
    include /etc/nginx/mime.types;
    absolute_redirect off;

    # verificação: PocketBase valida o JWT do cookie (auth-refresh exige token válido)
    location = /_auth {
        internal;
        proxy_pass http://atlas-db:8090/api/collections/users/auth-refresh;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $cookie_atlas_token;
    }

    # livres: tela do PIN e os bundles (JS/CSS/fontes não revelam conteúdo)
    location /gate/ { try_files $uri $uri/ /gate/index.html; }
    location /_app/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # livres também: manifest e ícones (o Android busca sem cookie ao instalar)
    location ~ ^/(favicon\.svg|manifest\.webmanifest|icon-\d+(-maskable)?\.png|apple-touch-icon\.png)$ { }

    location / {
        auth_request /_auth;
        error_page 401 403 = @gate;
        try_files $uri $uri/ $uri.html /200.html;  # URL de título renomeado: o app resolve o alias
    }
    location @gate { return 302 /gate/?next=$request_uri; }

    gzip on; gzip_types text/html text/css application/javascript image/svg+xml application/json;
}
